[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "removebg-watcher"
version = "2.1.0"
description = "Local desktop watcher for automated image background removal"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "rembg[cpu]>=2.0.65,<3",
    "Pillow>=10,<13",
    "pillow-heif>=0.18,<2",
    "tkinterdnd2>=0.4,<1",
    "customtkinter>=5.2,<7",
]

[project.gui-scripts]
removebg-watcher = "removebg_app.main:main"

[tool.setuptools.packages.find]
include = ["removebg_app*"]
